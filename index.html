<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f4f6;
            color: #172033;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .contact-container {
            width: 100%;
            max-width: 950px;

            display: grid;
            grid-template-columns: 40% 60%;

            background: white;
            border-radius: 18px;
            overflow: hidden;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.10);
        }

        /* Left section */

        .contact-info {
            background: #172033;
            color: white;

            padding: 50px 40px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .contact-info .label {
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;

            color: #b9c2d0;

            margin-bottom: 20px;
        }

        .contact-info h1 {
            font-size: 42px;
            line-height: 1.1;

            margin-bottom: 20px;
        }

        .contact-info p {
            color: #cbd2dc;

            font-size: 16px;
            line-height: 1.7;
        }

        /* Form section */

        .contact-form {
            padding: 50px 45px;
        }

        .contact-form h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .description {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            font-size: 14px;
            font-weight: 600;

            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;

            border: 1px solid #d5d9df;
            border-radius: 9px;

            padding: 13px 14px;

            font-family: inherit;
            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        input {
            height: 48px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #172033;

            box-shadow:
                0 0 0 3px rgba(23, 32, 51, 0.08);
        }

        button {
            width: 100%;
            height: 50px;

            border: none;
            border-radius: 9px;

            background: #172033;
            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #27344d;
        }

        .note {
            text-align: center;

            font-size: 12px;
            color: #7b8492;

            margin-top: 14px;
        }

        /* Mobile */

        @media (max-width: 700px) {

            .contact-container {
                grid-template-columns: 1fr;
            }

            .contact-info {
                padding: 35px 28px;
            }

            .contact-info h1 {
                font-size: 34px;
            }

            .contact-form {
                padding: 35px 28px;
            }
        }
    </style>
</head>

<body>

    <main class="contact-container">

        <section class="contact-info">

            <div class="label">
                Contact
            </div>

            <h1>
                Let's talk.
            </h1>

            <p>
                Have a question, suggestion, or message?
                Fill out the form and send it to us.
            </p>

        </section>


        <section class="contact-form">

            <h2>
                Contact Us
            </h2>

            <p class="description">
                Enter your details and message below.
            </p>


            <!--
                Java backend endpoint:
                /contact-form-backend/submit

                The public ngrok URL will be added later.
            -->

            <form
                action="https://gush-veto-protract.ngrok-free.dev/contact-form-backend/submit"
                method="POST"
            >

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        maxlength="50"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        maxlength="100"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="Write your message..."
                        maxlength="5000"
                        required
                    ></textarea>

                </div>


                <button type="submit">
                    Send Message
                </button>

                <p class="note">
                    All fields are required.
                </p>

            </form>

        </section>

    </main>

</body>
</html>
